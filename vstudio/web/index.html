<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Viral Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%23FF4D8D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 9.5v13l10.5-6.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Studio navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><path d="M12 9.5v13l10.5-6.5z" fill="#fff"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Viral Studio</span>
          <span class="brand-sub">runs on this computer</span>
        </span>
      </div>

      <div class="project-switch">
        <label class="eyebrow" for="project-select">Project</label>
        <div class="project-switch-row">
          <select id="project-select" class="select" aria-label="Current project"></select>
          <button type="button" class="icon-btn" id="new-project-btn" title="New project" aria-label="New project"></button>
        </div>
      </div>

      <nav id="nav" class="nav" aria-label="Sections"></nav>

      <div class="sidebar-foot">
        <a href="#/settings" class="health" id="health-foot" aria-live="polite">
          <span class="dot dot-idle" aria-hidden="true"></span><span class="health-text">Checking engine...</span>
        </a>
        <div class="foot-note" id="foot-note">127.0.0.1 · local only</div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Viral Studio</h1>
          <p id="page-sub" class="page-sub"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <div id="view" class="view" aria-live="off"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" role="region" aria-label="Notifications"></div>

  <noscript>
    <div class="noscript">Viral Studio needs JavaScript. It runs only on this computer; nothing is sent to other sites.</div>
  </noscript>
  <script src="/app.js" defer></script>
</body>
</html>
